[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
yuki = "1.5.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
yukihook-bom = { group = "com.highcapable.yukihookapi", name = "yukihook-bom", version.ref = "yuki" }
yukihook-core = { group = "com.highcapable.yukihookapi", name = "yukihook-core" }
yukihook-compiler = { group = "com.highcapable.yukihookapi", name = "yukihook-compiler" }
yukihook-runtime-libxposed = { group = "com.highcapable.yukihookapi", name = "yukihook-runtime-libxposed" }
libxposed-api = { group = "io.github.libxposed", name = "api", version = "102.0.0" }
