name: Build standalone SplashGuard API102
on:
  push:
    branches: ['standalone/splashguard-api102']
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 37.2
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" --install 'platforms;android-37.2' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Verify Xposed API102 module metadata
        run: python3 tools/check_metadata.py

      - name: Verify actual launcher icon resources
        run: |
          python3 - <<'PY'
          import glob, zipfile
          apk = glob.glob("app/build/outputs/apk/debug/*.apk")[0]
          with zipfile.ZipFile(apk) as z:
              members=set(z.namelist())
              icon=[x for x in members if x.endswith("app_icon_v2.webp")]
              adaptive=[x for x in members if x.endswith("ic_launcher.xml")]
              assert icon, "Missing packaged illustrated launcher bitmap"
              assert adaptive, "Missing adaptive launcher icon XML"
              print("Launcher resources:", icon, adaptive)
          PY
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SplashGuard-API102-debug
          path: app/build/outputs/apk/debug/*.apk
