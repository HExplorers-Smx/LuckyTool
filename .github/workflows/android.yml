name: Build standalone SplashGuard API102
on:
  push:
    branches: ['standalone/splashguard-api102']
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 37.2
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" --install 'platforms;android-37.2' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Verify Xposed API102 module metadata
        run: python3 tools/check_metadata.py

      - name: Verify actual launcher icon resources
        run: |
          python3 - <<'PY'
          import glob, zipfile
          apk = glob.glob("app/build/outputs/apk/debug/*.apk")[0]
          with zipfile.ZipFile(apk) as z:
              members=set(z.namelist())
              icon=[x for x in members if x.endswith("app_icon_v2.webp")]
              adaptive=[x for x in members if x.endswith("ic_launcher.xml")]
              assert icon, "Missing packaged illustrated launcher bitmap"
              assert adaptive, "Missing adaptive launcher icon XML"
              print("Launcher resources:", icon, adaptive)
          PY
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android 15 emulator launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.hexplorers.splashguard/.MainActivity
            sleep 8
            adb logcat -d -v time > /tmp/jianjing-smoketest-logcat.txt
            python3 -c 'from pathlib import Path; s=Path("/tmp/jianjing-smoketest-logcat.txt").read_text(errors="replace"); failures=[b[:4000] for b in s.split("FATAL EXCEPTION")[1:] if "com.hexplorers.splashguard" in b[:4000]]; print("\\n".join(failures[:2])); assert not failures, "JianJing startup fatal exception detected"'
            adb shell pidof com.hexplorers.splashguard
            adb shell screencap -p /sdcard/jianjing-screenshot.png
            adb pull /sdcard/jianjing-screenshot.png jianjing-screenshot.png
      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JianJing-Emulator-Screenshot
          path: jianjing-screenshot.png
          if-no-files-found: ignore
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SplashGuard-API102-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
